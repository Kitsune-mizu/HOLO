# Pengaturan HologramOS. Kunci API tidak ditulis di sini, simpan di file .env.

[app]
# "mode" SUDAH TIDAK DIPAKAI: HologramOS (tampilan model 3D) sekarang selalu memakai AI lokal
# (Ollama), tidak ada lagi mode online untuk mode ini - itu sekarang murni urusan "Mode AI"
# (tombol MODE AI di antarmuka), lihat section [online] dan [ai_full] di bawah.
window_width = 1280
window_height = 720
default_model = "pyramid"   # id model di assets/models.json

[viewer]
wireframe = false            # garis kawat seperti gambar referensi. false = permukaan penuh
idle_spin_dps = 8           # putaran pelan saat diam, derajat per detik. 0 = mati
rotate_step_deg = 45        # sudut satu kali swipe atau perintah "putar"
zoom_step = 1.35            # pengali sekali zoom in/out

[camera]
enabled = true
index = 0
width = 640
height = 480
fps = 30
detect_fps = 24             # kecepatan deteksi tangan (thread terpisah); naikkan kalau CPU kuat dan swipe cepat masih putus

[hands]
min_confidence = 0.6
min_open_fingers = 3        # hanya untuk info di layar (status "terbuka"/"tertutup"), tidak mempengaruhi gesture

[gesture]
# Satu tangan menunjuk, telunjuk dimiringkan kanan/kiri = model berputar terus selama pose ditahan.
deadzone_deg = 8             # kemiringan di bawah ini dianggap tegak lurus, tidak berputar
max_tilt_deg = 45            # kemiringan sebesar ini (atau lebih) = kecepatan putar maksimum
max_dps = 150                # kecepatan putar maksimum, derajat per detik
# Satu tangan DUA JARI (telunjuk + tengah, seperti "peace" tapi rapat), dimiringkan kanan/kiri =
# model mengangguk atas/bawah. Mekanismenya sama persis dengan kemiringan satu-jari di atas, hanya
# jumlah jari yang membedakan mana yang mengendalikan yaw dan mana yang mengendalikan pitch.
pitch_deadzone_deg = 8       # sama seperti deadzone_deg di atas, untuk sumbu pitch
pitch_max_tilt_deg = 45      # sama seperti max_tilt_deg di atas, untuk sumbu pitch
pitch_max_dps = 150          # sama seperti max_yaw_dps di atas, untuk sumbu pitch
# Dua tangan menunjuk, jarak ujung telunjuk berubah = zoom (seperti cubit di layar sentuh).
deadzone_per_s = 0.03        # perubahan jarak sekecil ini per detik dianggap diam, tidak zoom
gain = 1.6                   # makin besar, makin sensitif gerakan tangan jadi zoom
max_rate_per_s = 1.2         # batas laju zoom, supaya tidak melompat
min_cutoff = 1.2             # filter One Euro: makin kecil makin halus
beta = 3.0                   # filter One Euro: makin besar makin responsif saat cepat
dropout_grace_s = 0.15       # kerangka tangan boleh hilang sebentar (gerakan cepat) tanpa membatalkan gesture

# Deteksi swipe (sentak sekali) di bawah ini TIDAK lagi dipakai, digantikan gesture kontinu di atas.
# Tapi filenya (hologram/vision/swipe.py) TETAP dipakai: gesture.py mengimpor OneEuroFilter dari
# situ untuk menghaluskan gerakan. Jangan hapus swipe.py.
[swipe]
distance = 0.22
min_speed = 0.9
window_s = 0.40
cooldown_s = 0.70
dominance = 1.6
min_cutoff = 1.5
beta = 4.0

[offline]
model = "auto"              # "auto" = model Ollama terbesar yang muat di RAM
host = ""                   # kosong = alamat bawaan Ollama
reserve_ram_gb = 2.0        # RAM yang disisakan untuk sistem
fast_commands = true        # zoom, putar, ganti model dijalankan langsung tanpa menunggu model
timeout_s = 120

[online]
# Dipakai HANYA oleh Mode AI (full_session.py) - HologramOS (tampilan model 3D) tidak pernah
# membaca section ini lagi, selalu lokal (lihat [offline] dan catatan di [app] di atas).
gemini_models = ["gemini-omni-1.1-flash", "gemini-2.5-flash"]   # model[0] yang dipakai Mode AI
min_interval_s = 4
cooldown_s = 90
use_search = false
timeout_s = 45
# "attach_snapshot" dan [[online.fallback]] (Groq/OpenRouter format lama) sengaja dihapus dari sini:
# keduanya hanya dipakai saat HologramOS punya mode online sendiri, kodenya sudah dihapus. OpenRouter
# untuk Mode AI sekarang diatur terpisah di [ai_full] di bawah, bukan di sini.

[voice]
enabled = true
stt_model = "base"          # folder di assets/whisper/ (base atau small)
stt_language = ""           # kosong = deteksi otomatis (Indonesia atau Inggris). "id" = paksa Indonesia
silence_s = 1.2             # hening sekian detik = selesai bicara
max_record_s = 20
tts_rate = 175
tts_engine = "edge"          # "edge" = suara online yang natural (butuh internet). "system" = suara bawaan Windows
tts_voice = "id-ID-GadisNeural"   # perempuan. Laki-laki: id-ID-ArdiNeural
tts_voice_en = "en-US-JennyNeural"   # suara untuk balasan berbahasa Inggris
tts_edge_rate = "+0%"       # kecepatan bicara, mis. "+10%" lebih cepat, "-10%" lebih pelan
tts_language = "id"         # untuk suara sistem (cadangan)
tts_system_voice_en = "Zira"   # suara Windows untuk Inggris saat offline (perempuan). Laki-laki: "David"
tts_system_voice_id = ""       # kosong = cari otomatis berdasar bahasa. Isi mis. "Damayanti" kalau OS punya suara itu

[ai_full]
engine = "gemini"            # "gemini" (butuh GEMINI_API_KEY) atau "openrouter" (butuh OPENROUTER_API_KEY)
openrouter_model = "google/gemma-3-27b-it:free"   # ganti sesuai model gratis pilihan di openrouter.ai/models
use_search = false            # kosongkan/ikut [online] kalau tidak diisi
max_output_tokens = 2048      # balasan Mode AI boleh jauh lebih panjang dari HologramOS (800)
tts_engine = "edge"           # "edge" (online, natural) atau "system" (suara OS, offline)

[network]
check_interval_s = 8